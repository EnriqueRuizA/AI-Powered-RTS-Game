# settings.example.ini — Medieval Conquest
# Copiar a settings.ini (local, ignorado por Git).

# Resolución de la ventana (default único: 1280x768)
screenW 1280
screenH 768

# Pantalla completa (0/1)
fullscreen 0

# Escala de UI: rango permitido 1.000 - 2.250 (el código lo limita)
uiScale 1.000

# Volúmenes (0.000 - 1.000)
masterVolume 1.000
musicVolume 0.700

# Dificultad: 0=EASY, 1=NORMAL, 2=HARD
difficulty 1

# Mostrar FPS (0/1)
showFPS 0

# Idioma: 0=EN, 1=ES
language 0

# Formación en batalla (px entre soldados 16..40, soldados por fila 3..10)
formationSpacing 26.000
formationPerRow 5

# Fase de preparación pre-batalla (0/1) y segundos de cuenta atrás (5..60)
usePrepPhase 1
prepTimeSec 15
